<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saravedi Chandru | VIP Profile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Custom Google Font (Montserrat for a bold, cinematic look) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Montserrat', sans-serif; }
        
        /* Premium Animated Dark-Red Gradient Background */
        .bg-animated {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #240b36, #3a0000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Red Neon Glow Effect */
        .neon-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6), 0 0 30px rgba(239, 68, 68, 0.4);
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="bg-animated min-h-screen text-white flex justify-center p-4 selection:bg-red-500 selection:text-white">

    <!-- Main Mobile-Optimized Container -->
    <main class="w-full max-w-md mt-8 pb-12 overflow-hidden">
        
        <!-- Profile Header Section -->
        <div class="text-center mb-8" data-aos="zoom-in" data-aos-duration="1000">
            <!-- Profile Picture -->
            <div class="relative inline-block">
                
                <!-- NOTE: If the image is still broken, change "chandru1.JPG" below to "chandru1.jpg" or "chandru1.jpeg" based on exactly how it looks in your GitHub repository -->
                <img src="chandru1.JPG" alt="Chandru" class="w-40 h-40 rounded-full mx-auto object-cover border-4 border-red-500 neon-red mb-4 transition-transform hover:scale-105 duration-300">
                
                <!-- Pisces Zodiac Badge -->
                <div class="absolute bottom-4 right-0 bg-gray-900 text-red-500 p-2 rounded-full border-2 border-red-500 shadow-lg">
                    <i class="fa-solid fa-fish text-sm"></i>
                </div>
            </div>
            
            <h1 class="text-4xl font-black tracking-tight text-white mt-2">CHANDRU</h1>
            <h2 class="text-lg font-bold text-red-500 uppercase tracking-widest mt-1 animate-pulse">🔥 Saravedi Chandru 🔥</h2>
            <p class="text-gray-400 mt-2 text-sm font-medium"><i class="fa-solid fa-cake-candles mr-1 text-red-400"></i> Est. 14.04.1999</p>
        </div>

        <!-- Call to Action: Instagram -->
        <div class="mb-10" data-aos="fade-up" data-aos-delay="200">
            <a href="https://www.instagram.com/chandrut1404?srtk=MWFiczF0dTBnbHh1Zg==" target="_blank" class="flex items-center justify-center gap-3 w-full bg-gradient-to-r from-red-600 to-red-800 py-4 px-4 rounded-2xl font-bold shadow-lg shadow-red-900/50 hover:from-red-500 hover:to-red-700 transition-all active:scale-95 text-lg">
                <i class="fa-brands fa-instagram text-2xl"></i> Follow on Instagram
            </a>
        </div>

        <!-- VIP Info Grid (Bento Box Style) -->
        <div class="grid grid-cols-2 gap-4 mb-10">
            
            <!-- Hero Card -->
            <div class="glass-card p-4 rounded-2xl text-center" data-aos="fade-right" data-aos-delay="300">
                <i class="fa-solid fa-motorcycle text-3xl text-red-500 mb-2"></i>
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Fav Hero</p>
                <p class="text-sm font-bold mt-1">Thala Ajith</p>
            </div>

            <!-- Heroine Card -->
            <div class="glass-card p-4 rounded-2xl text-center" data-aos="fade-left" data-aos-delay="400">
                <i class="fa-solid fa-heart text-3xl text-red-500 mb-2"></i>
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Fav Heroines</p>
                <p class="text-sm font-bold mt-1">Samantha & Nayanthara</p>
            </div>

            <!-- Movie Card -->
            <div class="glass-card p-4 rounded-2xl text-center" data-aos="fade-right" data-aos-delay="500">
                <i class="fa-solid fa-film text-3xl text-red-500 mb-2"></i>
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Fav Movie</p>
                <p class="text-sm font-bold mt-1">Vaazhai</p>
            </div>

            <!-- Singer Card -->
            <div class="glass-card p-4 rounded-2xl text-center" data-aos="fade-left" data-aos-delay="600">
                <i class="fa-solid fa-microphone-lines text-3xl text-red-500 mb-2"></i>
                <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Fav Singer</p>
                <p class="text-sm font-bold mt-1">Pradeep Kumar</p>
            </div>

            <!-- Food Card (Spans full width) -->
            <div class="glass-card p-4 rounded-2xl text-center col-span-2 flex items-center justify-center gap-4" data-aos="zoom-in" data-aos-delay="700">
                <i class="fa-solid fa-bowl-food text-3xl text-red-500"></i>
                <div class="text-left">
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Fuel of Choice</p>
                    <p class="text-base font-bold">Unlimited Biriyani</p>
                </div>
            </div>
        </div>

        <!-- Photo Gallery Section -->
        <div data-aos="fade-up" data-aos-delay="800">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-px bg-red-500/50 flex-1"></div>
                <h2 class="text-sm font-black text-red-500 uppercase tracking-widest">Saravedi Gallery</h2>
                <div class="h-px bg-red-500/50 flex-1"></div>
            </div>
            
            <!-- Dynamic Grid Layout -->
            <div class="grid grid-cols-2 gap-3">
                <img src="chandru2.JPG" alt="Gallery 1" class="w-full h-48 object-cover rounded-2xl border border-gray-700 hover:border-red-500 transition-all duration-300">
                <img src="chandru3.JPG" alt="Gallery 2" class="w-full h-48 object-cover rounded-2xl border border-gray-700 hover:border-red-500 transition-all duration-300">
                <img src="chandru4.JPG" alt="Gallery 3" class="w-full h-48 object-cover rounded-2xl border border-gray-700 hover:border-red-500 transition-all duration-300 col-span-2">
                <img src="chandru5.JPG" alt="Gallery 4" class="w-full h-40 object-cover rounded-2xl border border-gray-700 hover:border-red-500 transition-all duration-300">
                <img src="chandru6.JPG" alt="Gallery 5" class="w-full h-40 object-cover rounded-2xl border border-gray-700 hover:border-red-500 transition-all duration-300">
            </div>
        </div>

        <div class="mt-12 text-center text-xs text-gray-500 font-medium" data-aos="fade-up">
            <p>Made with ❤️ by your best friend</p>
        </div>
        
    </main>

    <!-- Initialize AOS Animation Script -->
    <script>
        AOS.init({
            duration: 800,
            once: true,
        });
    </script>
</body>
</html>
